# dsh bundle patch for dsh-desktop-signal.
#
# 1. Force directory-picker to browse mode.
# When dsh web is proxied through the desktop gateway, dsh sees loopback
# (127.0.0.1) and auto-mounts the native OS file picker, which fails on mobile
# phones (the OS dialog opens on the desktop PC display).
# Pinning the browse interaction replaces the native chooser with the in-app
# Miller-column browser dialog that works across all mobile browsers and desktop.
#
# 2. Register dsh-desktop-signal.
- id: directory-picker
  disabled: true
- insert:
    - id: directory-picker-browse-backend
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: directory-picker-browse-surface
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
    - id: desktop-signal
      name: 'dsh-desktop-signal'

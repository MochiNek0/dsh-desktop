<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dsh desktop</title>
    <style>
      /* The theme is the window's, and the window's is dsh's: the app answers
         `prefers-color-scheme` inside this webview with dsh's own saved
         preference, and keeps answering it as that preference changes. See
         src-tauri/src/theme.rs. So there is nothing to resolve here and nothing
         to be told — a media query is already the right answer, at parse time,
         on every return to this page. */
      :root {
        color-scheme: light;
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #6b7280;
        --line: #e5e7eb;
        --accent: #4d6bfe;
        --danger: #b42318;
        --panel: #f7f8fa;
        /* The accent, diluted — the wash behind the wordmark. */
        --glow: rgba(77, 107, 254, 0.1);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #101014;
          --fg: #ececf1;
          --muted: #9aa0ac;
          --line: #26262e;
          --danger: #f97066;
          --panel: #17171d;
          --glow: rgba(77, 107, 254, 0.16);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(72% 52% at 50% 34%, var(--glow), transparent 68%),
          var(--bg);
        color: var(--fg);
        font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      main {
        width: min(560px, 86vw);
        text-align: center;
      }
      /* Everything below the icon arrives the same way, each piece a little
         after the one above it. */
      @keyframes arrive {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      /* The app icon, put together out of its own pixels: they fly in on the
         canvas `.fly` for about a second, and the canvas is then removed and
         the still drawing in `.tile` shown in its place. The flight's last
         frame is that drawing, pixel for pixel, so the swap does not show. */
      .hero {
        position: relative;
        width: 136px;
        height: 136px;
        margin: 0 auto 22px;
      }
      /* The white tile is what keeps the #333 body legible on dark. It and its
         glow are the element itself, so they fade in over the flight rather
         than switching on when it lands. */
      .hero .tile {
        position: absolute;
        inset: 0;
        border-radius: 22%;
        background: #fff;
        box-shadow: 0 8px 36px rgba(77, 107, 254, 0.28);
        animation: tile 1s ease-out both;
      }
      @keyframes tile {
        from {
          opacity: 0;
          transform: scale(0.92);
        }
      }
      .hero canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
      .hero .tile canvas {
        visibility: hidden;
      }
      .hero.built .tile canvas {
        visibility: visible;
      }
      /* Three tiles wide, so a pixel can start from beyond the icon's edges. */
      .hero .fly {
        left: -100%;
        top: -100%;
        width: 300%;
        height: 300%;
        pointer-events: none;
      }
      /* Once the whale is built it stays still; these rise beside it. Moved
         and faded only, in pixel-sized steps, which the compositor does on a
         layer it already has. */
      .bubble {
        position: absolute;
        width: 8px;
        height: 8px;
        background: var(--accent);
        opacity: 0;
        animation: bubble 3.2s steps(10) infinite;
      }
      .bubble:nth-of-type(1) {
        left: -22px;
        top: 92px;
        animation-delay: 1.3s;
      }
      .bubble:nth-of-type(2) {
        left: 150px;
        top: 76px;
        width: 4px;
        height: 4px;
        animation-delay: 2.1s;
      }
      .bubble:nth-of-type(3) {
        left: -40px;
        top: 40px;
        width: 4px;
        height: 4px;
        animation-delay: 2.9s;
      }
      .bubble:nth-of-type(4) {
        left: 166px;
        top: 118px;
        animation-delay: 3.5s;
      }
      @keyframes bubble {
        0% {
          opacity: 0;
          transform: translateY(0);
        }
        10% {
          opacity: 0.55;
        }
        80% {
          opacity: 0.35;
        }
        100% {
          opacity: 0;
          transform: translateY(-80px);
        }
      }
      /* The lockup: "dsh" is the logotype, "desktop" the product tag. */
      .mark {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        animation: arrive 500ms cubic-bezier(0.2, 0.7, 0.3, 1) 0.8s both;
      }
      .mark .logo {
        font-size: 36px;
        font-weight: 600;
        letter-spacing: 0;
      }
      .mark .logo span {
        color: var(--accent);
      }
      /* Tag and version share one column past the rule, so the build number
         costs the page no line of its own. */
      .mark .meta {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 1px;
        padding-left: 12px;
        border-left: 1px solid var(--line);
        /* The tag's tracking hangs off its last letter; pull it back so the
           lockup stays optically centred. */
        margin-right: -0.22em;
      }
      .mark .tag {
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
      }
      /* Selectable on purpose: the whole reason to show a version is so it can
         go into a bug report. */
      #version {
        font-size: 11px;
        line-height: 1.3;
        letter-spacing: 0.04em;
        color: var(--muted);
        opacity: 0.7;
        user-select: text;
        -webkit-user-select: text;
      }
      #version:empty {
        display: none;
      }
      .tagline {
        margin: 2px 0 22px;
        font-size: 12px;
        line-height: 1.4;
        letter-spacing: 0.08em;
        color: var(--muted);
        animation: arrive 500ms cubic-bezier(0.2, 0.7, 0.3, 1) 1s both;
      }
      /* The spinner, as a row of pixels in a wave. */
      .wave {
        display: flex;
        justify-content: center;
        gap: 5px;
        height: 14px;
        margin-bottom: 6px;
        animation: arrive 400ms ease 1.15s both;
      }
      .wave i {
        width: 6px;
        height: 6px;
        margin-top: 8px;
        background: var(--accent);
        animation: wave 1.2s steps(1) infinite;
      }
      .wave i:nth-child(2) {
        animation-delay: 0.12s;
      }
      .wave i:nth-child(3) {
        animation-delay: 0.24s;
      }
      .wave i:nth-child(4) {
        animation-delay: 0.36s;
      }
      .wave i:nth-child(5) {
        animation-delay: 0.48s;
      }
      @keyframes wave {
        0% {
          transform: translateY(0);
          opacity: 0.35;
        }
        15% {
          transform: translateY(-4px);
          opacity: 0.7;
        }
        30% {
          transform: translateY(-8px);
          opacity: 1;
        }
        45% {
          transform: translateY(-4px);
          opacity: 0.7;
        }
        60% {
          transform: translateY(0);
          opacity: 0.35;
        }
      }
      /* The script draws the whale already built for these; see `built`. */
      @media (prefers-reduced-motion: reduce) {
        .hero .tile,
        .bubble,
        .mark,
        .tagline,
        .wave,
        #status {
          animation: none;
        }
        .wave i {
          animation-duration: 3.6s;
        }
      }
      /* The app draws its cards over whatever page the window shows, this one
         included: the runtime chooser opens on it before dsh exists, the
         plugin guide on the first launch, and a dialog can be raised over
         either. All three are a full-viewport `backdrop-filter: blur()`, so
         anything still moving underneath one makes the compositor re-blur the
         whole window every frame for something nobody can see. Same mistake
         `controls` measured at 1.6% of a core; see the note at its own
         spinner. */
      html:has(.dsh-su-shown, .dsh-pp-shown, .dsh-ask-shown) .bubble,
      html:has(.dsh-su-shown, .dsh-pp-shown, .dsh-ask-shown) .wave i {
        animation-play-state: paused;
      }
      #status {
        margin: 0;
        color: var(--muted);
        animation: arrive 400ms ease 1.15s both;
      }
      /* Shown only while a dsh download is running; see dshProgress below. */
      #progress {
        width: 260px;
        height: 4px;
        margin: 16px auto 0;
        border-radius: 999px;
        background: var(--line);
        overflow: hidden;
      }
      #progress[hidden] {
        display: none;
      }
      #progress-fill {
        height: 100%;
        width: 0;
        border-radius: inherit;
        background: var(--accent);
        transition: width 240ms ease;
      }
      #error {
        display: none;
        text-align: left;
      }
      #error h2 {
        font-size: 15px;
        margin: 0 0 8px;
        color: var(--danger);
      }
      #error pre {
        margin: 0;
        overflow: auto;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font: 12px/1.5 ui-monospace, Consolas, monospace;
        color: var(--muted);
        white-space: pre-wrap;
        word-break: break-word;
        user-select: text;
        -webkit-user-select: text;
        max-height: 40vh;
      }
      body.failed .bubble,
      body.failed .tagline,
      body.failed .wave,
      body.failed #status,
      body.failed #progress {
        display: none;
      }
      /* An error wants the room for its detail, and at the window's minimum
         height the full-size icon would push the buttons off the bottom. */
      body.failed .hero {
        width: 64px;
        height: 64px;
        margin-bottom: 16px;
      }
      body.failed .mark {
        margin-bottom: 20px;
      }
      body.failed #error {
        display: block;
      }
      #error-ask {
        margin: 10px 0 0;
        font-size: 12px;
        color: var(--muted);
        user-select: text;
        -webkit-user-select: text;
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 14px;
      }
      #error-retry,
      #error-safe,
      #error-fix {
        display: none;
      }
      body.failed.retryable #error-retry,
      body.failed.rescuable #error-safe,
      body.failed.fixable #error-fix {
        display: inline-flex;
      }
      button {
        all: unset;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 32px;
        padding: 0 15px;
        border-radius: 8px;
        border: 1px solid var(--line);
        cursor: pointer;
        font: 13px/1 inherit;
        color: var(--fg);
        white-space: nowrap;
      }
      button:hover {
        background: var(--panel);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button.primary:hover {
        filter: brightness(1.08);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="hero" id="hero">
        <div class="tile"><canvas id="tile" width="34" height="34"></canvas></div>
        <canvas class="fly" id="fly" width="102" height="102"></canvas>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
      </div>
      <div class="mark">
        <span class="logo">d<span>s</span>h</span>
        <span class="meta">
          <span class="tag">desktop</span>
          <span id="version"></span>
        </span>
      </div>
      <p class="tagline" id="tagline"></p>
      <div class="wave"><i></i><i></i><i></i><i></i><i></i></div>
      <p id="status"></p>
      <div id="progress" hidden><div id="progress-fill"></div></div>
      <div id="error">
        <h2 id="error-title"></h2>
        <pre id="error-detail"></pre>
        <div class="actions">
          <button id="error-fix" class="primary"></button>
          <button id="error-retry" class="primary"></button>
          <button id="error-safe"></button>
          <button id="error-copy"></button>
        </div>
        <p id="error-ask"></p>
      </div>
    </main>

    <!-- The app icon as pixel vectors (hand-drawn, 26x24). The 116 source
         paths are merged into 8 by consecutive fill, document order kept so
         the overdraw is unchanged. The artwork sits unscaled inside a 34x34
         tile. Never drawn as it is: the script below reads it back into
         pixels for the hero. -->
    <template id="whale">
      <svg viewBox="-4 -5 34 34" aria-hidden="true">
        <clipPath id="whale-tile">
          <rect x="-4" y="-5" width="34" height="34" rx="7.4" />
        </clipPath>
        <g clip-path="url(#whale-tile)">
          <rect x="-4" y="-5" width="34" height="34" fill="#fff" />
          <path fill="black" d="M5 7H11V8H5V7ZM3 8H5V9H3V8ZM2 9H3V10H2V9ZM1 16H2V18H1V16ZM2 18H3V19H2V18ZM4 20H6V21H4V20ZM6 21H12V22H6V21ZM13 9H14V10H13V9ZM14 10H15V11H14V10ZM13 9H14V10H13V9ZM15 11H16V12H15V11ZM16 12H17V13H16V12ZM17 13H18V14H17V13ZM18 14H19V15H18V14ZM19 13H20V14H19V13ZM20 12H21V13H20V12ZM19 11H20V12H19V11ZM18 10H19V11H18V10ZM18 6H19V7H18V6ZM19 7H20V8H19V7ZM20 8H21V9H20V8ZM21 9H22V10H21V9ZM25 8H26V10H25V8ZM24 7H25V8H24V7ZM24 10H25V11H24V10ZM23 11H24V12H23V11ZM21 15H22V17H21V15ZM20 17H21V18H20V17ZM19 18H20V19H19V18ZM18 19H19V20H18V19ZM17 20H18V21H17V20ZM12 20H13V21H12V20ZM15 20H16V21H15V20ZM17 18H18V19H17V18ZM14 18H15V19H14V18ZM18 17H20V18H18V17ZM14 19H17V20H14V19ZM11 18H12V20H11V18ZM1 15H2V16H1V15ZM2 14H4V15H2V14ZM4 15H6V16H4V15ZM6 16H8V17H6V16ZM8 17H11V18H8V17ZM13 21H17V22H13V21ZM22 12H23V15H22V12ZM22 8H24V9H22V8ZM17 7H18V10H17V7ZM11 8H13V9H11V8ZM3 19H4V20H3V19ZM0 12H1V16H0V12ZM1 10H2V12H1V10ZM8 14H9V15H8V14ZM8 13H9V14H8V13ZM9 12H10V13H9V12ZM10 13H11V14H10V13ZM10 15H11V16H10V15ZM11 14H12V15H11V14ZM9 14H10V15H9V14Z"/>
          <path fill="#6C8CFF" d="M10 14H11V15H10V14Z"/>
          <path fill="#FFB6D5" d="M11 15H12V16H11V15Z"/>
          <path fill="#333333" d="M5 8H11V9H5V8ZM3 9H13V10H3V9ZM2 10H14V11H2V10ZM2 11H15V12H2V11ZM1 12H9V13H1V12ZM1 13H8V14H1V13ZM1 14H2V15H1V14ZM19 14H22V15H19V14ZM20 13H22V14H20V13ZM21 12H22V13H21V12ZM20 11H23V12H20V11ZM19 10H24V11H19V10ZM18 9H21V10H18V9ZM22 9H25V10H22V9ZM11 17H18V18H11V17ZM12 18H14V19H12V18ZM12 19H14V20H12V19ZM13 20H15V21H13V20ZM15 18H17V19H15V18ZM18 8H20V9H18V8ZM18 7H19V8H18V7ZM24 8H25V9H24V8ZM4 14H8V15H4V14ZM6 15H10V16H6V15ZM10 12H16V13H10V12ZM11 13H17V14H11V13ZM12 14H18V15H12V14ZM12 15H21V16H12V15ZM8 16H21V17H8V16Z"/>
          <path fill="#D9D9D9" d="M3 10H4V11H3V10ZM16 20H17V21H16V20ZM17 19H18V20H17V19ZM2 15H3V18H2V15ZM3 18H4V19H3V18ZM4 19H6V20H4V19ZM6 20H9V21H6V20Z"/>
          <path fill="#6C8CFF" d="M9 2H10V6H9V2ZM11 4H12V6H11V4ZM12 4H15V5H12V4ZM12 3H14V4H12V3ZM10 0H11V3H10V0ZM7 3H8V5H7V3ZM5 2H7V4H5V2Z"/>
          <path fill="#E6E3FF" d="M3 21H6V22H3V21ZM1 22H21V23H1V22ZM3 23H19V24H3V23ZM12 21H13V22H12V21ZM17 21H19V22H17V21Z"/>
          <path fill="white" d="M3 15H4V16H3V15ZM3 16H6V17H3V16ZM3 17H8V18H3V17ZM4 18H11V19H4V18ZM6 19H11V20H6V19ZM9 20H12V21H9V20ZM18 18H19V19H18V18ZM9 13H10V14H9V13Z"/>
        </g>
      </svg>
    </template>

    <script>
      (function () {
        // Which half of each pair to use; pushed in by Rust before this page
        // parses, out of the same system locale everything else reads. See
        // src-tauri/src/i18n.rs — the two languages live inline there too.
        var zh = (window.__DSH_LANG__ || 'zh') === 'zh';
        function t(chinese, english) {
          return zh ? chinese : english;
        }

        // The channel back to Rust: a navigation the app cancels the moment it
        // recognises it. See controls.rs — there is no IPC in this window, and
        // this page uses the same door the titlebar buttons do.
        function signal(verb) {
          window.location.href = 'dsh-window://' + verb;
        }

        var id = function (name) {
          return document.getElementById(name);
        };

        // ----------------------------------------------------- the boot --

        // Only what shows before Rust's first `dshStatus` lands. Deliberately
        // not "starting dsh": on a cold boot the first real stage is the update
        // check, so saying "starting" here would flash the wrong thing. The
        // retry button below does reset to "starting", because `restart_dsh`
        // goes straight to `start_serving`.
        id('status').textContent = t('正在准备…', 'Getting ready…');

        // Absent only when this page is opened outside the app; see main.rs.
        if (window.__DSH_VERSION__) {
          id('version').textContent = 'v' + window.__DSH_VERSION__;
        }
        id('tagline').textContent = t('想做什么，用 dsh 做出来', 'build anything with dsh');

        // ------------------------------------------------------- the hero --

        // The icon's own path data, read back into pixels. Every path is a run
        // of axis-aligned rectangles (`M x yH..V..H..V..Z`), so splitting each
        // into unit squares recovers the drawing exactly, overdraw order kept.
        // Shifted by the viewBox's origin, so they land on the 34x34 tile.
        var pixels = [];
        id('whale').content.querySelectorAll('path').forEach(function (path) {
          var fill = path.getAttribute('fill');
          var run = /M(\d+) (\d+)H(\d+)V(\d+)H\d+V\d+Z/g;
          var d = path.getAttribute('d');
          var m;
          while ((m = run.exec(d))) {
            for (var y = +m[2]; y < +m[4]; y++) {
              for (var x = +m[1]; x < +m[3]; x++) {
                pixels.push({ x: x + 4, y: y + 5, fill: fill });
              }
            }
          }
        });
        var tile = id('tile').getContext('2d');
        pixels.forEach(function (p) {
          tile.fillStyle = p.fill;
          tile.fillRect(p.x, p.y, 1, 1);
        });

        var hero = id('hero');
        var fly = id('fly');
        // Shown in place of the flight: from here on, nothing on the icon moves.
        function built() {
          fly.remove();
          hero.classList.add('built');
        }

        if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
          built();
        } else {
          // Each pixel starts somewhere on a ring around the tile and flies
          // home, sweeping from the tail to the head. The flight canvas is the
          // tile three times over with the tile in the middle, hence the 34s.
          var flights = pixels.map(function (p) {
            var angle = Math.random() * Math.PI * 2;
            var reach = 22 + Math.random() * 18;
            return {
              p: p,
              x: 17 + Math.cos(angle) * reach,
              y: 17 + Math.sin(angle) * reach,
              delay: (p.x / 34) * 380 + Math.random() * 140
            };
          });
          var FLIGHT = 560;
          var TOTAL = 380 + 140 + FLIGHT;
          var ctx = fly.getContext('2d');
          var start = null;
          var frame = function (now) {
            if (start === null) start = now;
            var elapsed = now - start;
            ctx.clearRect(0, 0, 102, 102);
            flights.forEach(function (f) {
              var progress = Math.max(0, Math.min(1, (elapsed - f.delay) / FLIGHT));
              if (progress === 0) return;
              var e = 1 - Math.pow(1 - progress, 4);
              ctx.globalAlpha = Math.min(1, progress * 3);
              ctx.fillStyle = f.p.fill;
              ctx.fillRect(
                Math.round(34 + f.x + (f.p.x - f.x) * e),
                Math.round(34 + f.y + (f.p.y - f.y) * e),
                1,
                1
              );
            });
            if (elapsed < TOTAL) {
              requestAnimationFrame(frame);
            } else {
              built();
            }
          };
          requestAnimationFrame(frame);
        }
        id('error-retry').textContent = t('重启 dsh', 'Restart dsh');
        id('error-retry').addEventListener('click', function () {
          document.body.classList.remove('failed', 'retryable');
          id('status').textContent = t('正在启动 dsh…', 'Starting dsh…');
          signal('restart-dsh');
        });

        // The way out of a plugin that will not let dsh start: the app puts
        // every installed plugin aside and starts again on dsh's own bundles,
        // which is enough of a dsh to open the plugin list in. It is offered
        // only where there is a plugin to put aside -- see `plugins::rescuable`
        // -- and what it does is undone from the titlebar menu afterwards.
        id('error-safe').textContent = t('不加载插件启动', 'Start without plugins');
        id('error-safe').addEventListener('click', function () {
          document.body.classList.remove('failed', 'retryable', 'rescuable');
          id('status').textContent = t('正在启动 dsh…', 'Starting dsh…');
          signal('safe-start');
        });

        // The way out of a profile that asks dsh to listen on every interface,
        // which newer dsh refuses to start on. The app swaps that one host for
        // loopback, backing the file up first, and starts again. Offered only
        // on that failure -- see `wildcard` in src-tauri.
        id('error-fix').textContent = t('改为仅本机并重启', 'Bind to this machine and restart');
        id('error-fix').addEventListener('click', function () {
          document.body.classList.remove('failed', 'retryable', 'rescuable', 'fixable');
          id('status').textContent = t('正在启动 dsh…', 'Starting dsh…');
          signal('fix-host');
        });

        var copy = id('error-copy');
        copy.textContent = t('复制详情', 'Copy details');
        copy.addEventListener('click', function () {
          // What a bug report needs: which build, what failed, and the detail
          // the Rust side sent.
          write(
            [
              ('dsh desktop ' + id('version').textContent).trim(),
              id('error-title').textContent,
              '',
              id('error-detail').textContent
            ].join('\n'),
            copy
          );
        });

        // Where to send what was just copied. The number is spelled out here
        // because this page is a file rather than something Rust writes; it is
        // `QQ_GROUP` in src-tauri/src/controls.rs.
        id('error-ask').textContent = t(
          '复制之后可以发到 QQ 群 1125671315 求助。',
          'Paste them into an issue at github.com/MochiNek0/dsh-desktop/issues.'
        );

        // This page runs on tauri.localhost, which counts as a secure context,
        // so the clipboard API is there — but fall back rather than leave the
        // button dead on a build where it is not.
        function write(text, button) {
          function copied() {
            button.textContent = t('已复制', 'Copied');
            setTimeout(function () {
              button.textContent = t('复制详情', 'Copy details');
            }, 1600);
          }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(copied, function () {
              legacy(text, copied);
            });
            return;
          }
          legacy(text, copied);
        }

        function legacy(text, copied) {
          var box = document.createElement('textarea');
          box.value = text;
          box.style.position = 'fixed';
          box.style.top = '-1000px';
          document.body.appendChild(box);
          box.select();
          try {
            if (document.execCommand('copy')) {
              copied();
            }
          } finally {
            box.remove();
          }
        }

        // Called from the Rust side via webview eval; see src-tauri/src/main.rs.
        window.dshStatus = function (text) {
          id('status').textContent = text;
        };
        // A percentage while a dsh download runs, or a negative number to put
        // the bar away. Arrives as a string — every splash call is serialized
        // as one.
        window.dshProgress = function (percent) {
          var bar = id('progress');
          var value = Number(percent);
          bar.hidden = !(value >= 0);
          id('progress-fill').style.width =
            Math.min(100, Math.max(0, value)) + '%';
        };
        window.dshError = function (title, detail, retry, rescue, fix) {
          document.body.classList.add('failed');
          document.body.classList.toggle('retryable', retry === 'retry');
          document.body.classList.toggle('rescuable', rescue === 'rescue');
          document.body.classList.toggle('fixable', fix === 'fix');
          id('error-title').textContent = title;
          id('error-detail').textContent = detail || '';
        };
      })();
    </script>
  </body>
</html>

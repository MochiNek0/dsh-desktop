[package]
name = "dsh-desktop"
version = "0.1.19"
description = "Desktop client for the DeepSeek Harness browser UI"
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.82"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
# `preserve_order` because one thing here does not just read JSON but writes it
# back: `plugins::forget_bundles` reparses the profile manifest, takes a name
# out of one array and reserializes the whole file. Without the feature a
# `Map` is a `BTreeMap`, so that round trip would alphabetise every key of a
# file dsh owns and rewrites itself — a diff nobody asked for, on every repair.
serde_json = { version = "1", features = ["preserve_order"] }
# dsh versions carry prerelease tags (`0.1.0-rc.6`); comparing those by hand is
# how you end up shipping rc.10 as older than rc.9.
semver = "1"
tauri-plugin-autostart = "2.5.1"
# The toast itself; see `toast`. This is the one dependency
# `tauri-plugin-notification` had, called directly because the plugin drops both
# the error and the handle its `show()` returns and this app needs both.
notify-rust = "4.18"
# Which of the two halves of every string to show; see `i18n`. One function and
# no dependencies of its own — the platform calls it wraps are three different
# ones, which is the whole reason not to write them here.
sys-locale = "0.3"
# One app per machine. Two of them would each spawn a `dsh web` against the same
# $DSH_HOME, and a dsh update would rewrite the tree the other one is running.
tauri-plugin-single-instance = "2"

# The phone gateway; see `remote`. Everything below this line was already in the
# tree — reqwest brings hyper, tokio, http and the body helpers, tauri brings
# base64 and the hashes — so what is new here is the feature flags and this
# crate's right to name them, not the crates themselves. `if-addrs` is the one
# addition, and it is the same trade `sys-locale` above is: one function, no
# dependencies of its own, and three different platform calls underneath that
# are the whole reason not to write it here.
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
# `net` for the listener, `io-util` for the byte copy that carries every
# WebSocket frame, `sync` for the channels the pairing handshake waits on.
# `macros` for `select!` and `join!`, which are what the accept loop and the
# WebSocket copy are written out of.
tokio = { version = "1", features = ["net", "io-util", "rt", "sync", "time", "macros"] }
if-addrs = "0.13"
# The device cookie: `sha2` under the HMAC written out in `remote::session`,
# `subtle` for the comparison that must not return early, `getrandom` for the
# nonce, `base64` to write both down. No `hmac` crate — see the RFC 4231
# vectors in that module's tests.
sha2 = "0.10"
subtle = "2"
# The stylesheet patch's update channel; see `remote::patch`. Both of these
# are already in the tree as `tauri-plugin-updater` dependencies -- the same
# reqwest, on the same rustls -- so what is new is this crate's right to name
# them. The alternative for the fetch was hyper, which is here too but brings
# no TLS of its own, so it would have meant a second TLS stack for one GET.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
minisign-verify = "0.2"
# Named only to install the crypto provider reqwest expects; `ring` is what
# rustls already has switched on in this tree, so this adds no code.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
getrandom = "0.3"
base64 = "0.22"
# Reading `?pair_token=` off a URL the phone typed, decoded the way a form is.
form_urlencoded = "1"

[target.'cfg(unix)'.dependencies]
# Process groups: `setpgid` before the exec and a signal to the whole group on
# the way out, which is the ordinary shutdown path — see `server::group_leader`.
# And on Linux `prctl(PR_SET_PDEATHSIG)`, which stands in for the job object
# below when that path never runs. See `server::tethered`.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# `MemoryUsageTargetLevel`, for the webview nobody is looking at; see `memory`.
# Both of these are already in the tree under wry, and the versions have to stay
# matched to the ones Tauri hands `PlatformWebview::controller` out of, or the
# cast to `ICoreWebView2_19` is a cast between two unrelated types.
webview2-com = "0.38"
windows-core = "0.61"
# Job objects: the kernel-side backstop that kills the dsh process tree when the
# app dies without running its own shutdown. See `server::Job`.
windows-sys = { version = "0.61", features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading", # the limit structs job objects are configured with
    "Win32_Security",         # SECURITY_ATTRIBUTES, in CreateJobObjectW's signature
] }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

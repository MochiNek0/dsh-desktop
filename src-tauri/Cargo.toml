[package]
name = "dsh-desktop"
version = "0.1.0"
description = "Desktop client for the DeepSeek Harness browser UI"
edition = "2021"
rust-version = "1.82"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

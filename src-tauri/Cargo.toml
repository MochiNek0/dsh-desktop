[package]
name = "dsh-desktop"
version = "0.1.1"
description = "Desktop client for the DeepSeek Harness browser UI"
edition = "2026"
rust-version = "1.82"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde_json = "1"
# dsh versions carry prerelease tags (`0.1.0-rc.6`); comparing those by hand is
# how you end up shipping rc.10 as older than rc.9.
semver = "1"
tauri-plugin-autostart = "2.5.1"
# One app per machine. Two of them would each spawn a `dsh web` against the same
# $DSH_HOME, and a dsh update would rewrite the tree the other one is running.
tauri-plugin-single-instance = "2"

[target.'cfg(unix)'.dependencies]
# Process groups: `setpgid` before the exec and a signal to the whole group on
# the way out, which is what stands in for the job object below. See
# `server::group_leader`.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Job objects: the kernel-side backstop that kills the dsh process tree when the
# app dies without running its own shutdown. See `server::Job`.
windows-sys = { version = "0.61", features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading", # the limit structs job objects are configured with
    "Win32_Security",         # SECURITY_ATTRIBUTES, in CreateJobObjectW's signature
] }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

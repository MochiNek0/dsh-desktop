# Check, then build the installers for every platform on a version tag, sign
# them, and put them — with the `latest.json` the updater reads — on a draft
# release.
#
# Draft, so that the release only goes out once someone has looked at it: the
# updater endpoint points at `releases/latest`, which a published release starts
# serving to every installed copy the moment it appears.
#
# What has to be configured for this to work, once, in the repository's
# Settings → Secrets and variables → Actions:
#
#   TAURI_SIGNING_PRIVATE_KEY   the *contents* of ~/.tauri/dsh-desktop.key
#
# Without it the build fails outright rather than quietly shipping something
# nothing can update to: the config carries a public key and asks for updater
# artifacts, and Tauri refuses to produce them unsigned.
#
# There is deliberately no TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret. That key
# has no password, GitHub will not store an empty secret, and a secret that does
# not exist renders as the empty string — which is exactly what the signer wants.
# Put a password on the key and this is where the secret to match it goes.

name: release

on:
  push:
    tags:
      - 'v*'
  # Never on a push to a branch: this repository is worked on directly on main,
  # where that would mean a build for every commit, prose included.
  workflow_dispatch:

# tauri-action creates the release and uploads to it.
permissions:
  contents: write

jobs:
  # Does it still compile, and do the unit tests still pass, on all three platforms?
  # This job only runs on manual dispatch to check code health without doing a full release bundle.
  test:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-22.04]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: install the Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential

      - run: cargo test --manifest-path src-tauri/Cargo.toml

  # The bootstrap script has no test suite and cannot have much of one, so what
  # is checked is that a stock `/bin/sh` can parse it and that shellcheck has
  # nothing to say.
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: check install-deps.sh
        run: |
          sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y dash shellcheck
          dash -n scripts/install-deps.sh
          shellcheck --shell=sh scripts/install-deps.sh

  # The same for `install-deps.ps1`, which had no check at all: 1400-odd lines
  # that are the only way a Windows machine gets a Node and a dsh, and nothing
  # here would have noticed a syntax error until a user's first launch.
  #
  # A job of its own rather than a step on the one above, because both things it
  # checks are properties of Windows PowerShell 5.1 and neither can be asked of
  # it from Linux. `shell: powershell` is 5.1 — `pwsh` would be 7, whose parser
  # accepts more than the shell this script actually runs under.
  #
  # This is the `dash -n` half. There is no `shellcheck` half yet: PSScriptAnalyzer
  # on a file this size wants a pass of triage first, and turning it on
  # unexamined would break the release pipeline rather than guard it.
  lint-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: check install-deps.ps1
        shell: powershell
        run: |
          # Resolved once and absolutely: the .NET calls below take a path from
          # the process's working directory, which is not the same thing as
          # PowerShell's own location.
          $script = (Resolve-Path 'scripts\install-deps.ps1').Path

          # The BOM first, because its absence is the failure a parse cannot
          # see: 5.1 reads a BOM-less file in the ANSI code page, so the script
          # goes on working and every Chinese message in it reaches the user as
          # mojibake. See the note at the top of the file.
          $opening = [System.IO.File]::ReadAllBytes($script)
          if ($opening[0] -ne 0xEF -or $opening[1] -ne 0xBB -or $opening[2] -ne 0xBF) {
              Write-Host "$script is not UTF-8 with a BOM; Windows PowerShell 5.1 would read it in the ANSI code page and every message in it would reach the user as mojibake."
              exit 1
          }

          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile($script, [ref] $null, [ref] $errors)
          if ($errors) {
              $errors | ForEach-Object { Write-Host "$($_.Extent.StartLineNumber): $($_.Message)" }
              exit 1
          }

          Write-Host "$script is UTF-8 with a BOM and parses clean."

  bundle:
    needs: [lint, lint-windows]
    # A tag is the only thing worth bundling for. A run started by hand stops
    # after the checks above.
    if: startsWith(github.ref, 'refs/tags/v')

    strategy:
      # One platform failing should not throw away the others' hour of build.
      fail-fast: false
      matrix:
        include:
          # One macOS bundle for both architectures. Building the two separately
          # would mean two of everything in the release and two entries per
          # platform in `latest.json`, for a download that is a few MB larger.
          - platform: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          # The oldest runner still supported: a .deb and an AppImage link
          # against the glibc of the machine that built them, so building on the
          # newest Ubuntu is what makes them refuse to start on anything else.
          - platform: ubuntu-22.04
            target: ''
            rust-targets: ''
          - platform: windows-latest
            target: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # webkit2gtk is the webview, libayatana-appindicator the tray, and patchelf
      # is what the AppImage bundler rewrites the interpreter path with.
      - name: install the Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            wget

      - run: npm ci

      - name: run cargo test
        run: cargo test --release --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: dsh desktop ${{ github.ref_name }}
          releaseDraft: true
          # Merged across the matrix, so the file the updater fetches carries an
          # entry for every platform rather than whichever job finished last.
          includeUpdaterJson: true
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
